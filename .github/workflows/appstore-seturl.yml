# App Store Pazarlama/Destek URL'sini ayarlar (app-ads.txt doğrulaması için). Elle tetiklenir.
name: App Store Set URL
on:
  workflow_dispatch:
    inputs:
      marketing_url:
        description: "Pazarlama URL'si"
        required: true
        default: "https://serhattutak2.github.io"
      support_url:
        description: "Destek URL'si"
        required: true
        default: "https://serhattutak2.github.io/destek.html"
permissions:
  contents: write
jobs:
  seturl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KID: ${{ secrets.ASC_KEY_ID }}
      ISS: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
      APP_ID: com.serhattutak.ilktapu
      MARKETING_URL: ${{ github.event.inputs.marketing_url }}
      SUPPORT_URL: ${{ github.event.inputs.support_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyjwt cryptography
      - name: URL'leri ayarla
        run: |
          set -o pipefail
          python3 tools/asc_seturl.py 2>&1 | tee "$RUNNER_TEMP/seturl.log"
      - name: Günlüğü yayınla
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/seturl.log"; [ -f "$f" ] || exit 0
          cp "$f" appstore-seturl.txt
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "CI günlükleri" --notes "Günlükler"
          gh release upload ci-logs appstore-seturl.txt --clobber
