# App Store metadata + ekran görüntülerini API ile basar (elle tetiklenir).
name: App Store Metadata
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Sürüm"
        required: true
        default: "1.0"
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KID: ${{ secrets.ASC_KEY_ID }}
      ISS: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
      APP_ID: com.serhattutak.ilktapu
      VER: ${{ github.event.inputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pyjwt cryptography
      - name: Metadata + görseller
        run: |
          set -o pipefail
          python3 tools/asc_meta.py 2>&1 | tee "$RUNNER_TEMP/meta.log"
      - name: Günlüğü yayınla
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          f="$RUNNER_TEMP/meta.log"; [ -f "$f" ] || exit 0
          KID2=$(printf '%s' "$KID" | LC_ALL=C tr -cd 'A-Za-z0-9'); ISS2=$(printf '%s' "$ISS" | LC_ALL=C tr -cd 'A-Za-z0-9-')
          sed -i -e "s/$KID2/[KEYID]/g" -e "s/$ISS2/[ISSUER]/g" -e '/PRIVATE KEY/d' "$f" || true
          cp "$f" meta-log.txt
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "CI günlükleri" --notes "Günlükler"
          gh release upload ci-logs meta-log.txt --clobber
