name: App Store Finalize
on:
  workflow_dispatch: {}
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KID: ${{ secrets.ASC_KEY_ID }}
      ISS: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
      APP_ID: com.serhattutak.ilktapu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pyjwt cryptography
      - run: python3 tools/asc_finalize.py
